# Stage 2: additive VAE bottleneck (timbre + emotion in one d-dim latent space).
_base_: [_base_/default.yaml, _base_/model.yaml, data/esd.yaml, gpu/rtx3090_4gpu.yaml]

stage: 2

# S x E x K layout; per-GPU batch is derived as num_speakers * num_emotions * per_cell.
sampler:
  num_speakers: 4
  per_cell: 2
  steps_per_epoch: 400
  drop_last: true

train:
  epochs: 200
  lr: 1.0e-4
  effective_batch_size: 160
  max_steps: 30000
  save_every_steps: 2000
  eval_every_steps: 1000

model:
  ppg:
    hidden: 256
    layers: 2
    heads: 4
    dropout: 0.1
    conv_kernel: 5
  dppg:
    max_clusters: 8

loss:
  rec_weight: 1.0
  kl_weight: 0.1
  kl_free_bits: 0.05
  kl_warmup_steps: 10000
  spk_weight: 0.5
  emo_weight: 0.5
  adv_weight: 0.1
  cross_weight: 0.5
  orth_weight: 0.01
  dir_weight: 0.1
  swap_weight: 0.2
  # Curriculum: reconstruction first, then attributes, then speaker-invariance.
  rec_only_steps: 5000
  attr_start_step: 5000
  adv_start_step: 10000
  adv_ramp_steps: 5000

paths:
  checkpoint_dir: checkpoints/stage2
  stage1_checkpoint: checkpoints/stage1/final.pt
