# Stage 3: text-to-emotion (T2E) distillation from the frozen stage-2 encoder.
_base_: [_base_/default.yaml, _base_/model.yaml, data/esd.yaml, gpu/rtx3090_4gpu.yaml]

stage: 3

train:
  epochs: 60
  lr: 1.0e-4
  effective_batch_size: 64
  per_gpu_batch_size: 16
  max_steps: 30000
  save_every_steps: 2000
  eval_every_steps: 1000

model:
  t2e:
    hidden: 256
    layers: 4
    heads: 4
    dropout: 0.1
    alpha_max: 2.0
    residual_ratio: 0.2
    max_frames: 4000

loss:
  distill_l1_weight: 1.0
  distill_cos_weight: 1.0
  emo_ce_weight: 0.5
  alpha_match_weight: 0.1
  residual_weight: 0.05
  duration_weight: 0.1

paths:
  checkpoint_dir: checkpoints/stage3
  stage2_checkpoint: checkpoints/stage2/final.pt
