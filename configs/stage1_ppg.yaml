# Stage 1: content branch (frame-level PPG head + DPPG tokenizer fitting).
_base_: [_base_/default.yaml, _base_/frontend.yaml, data/esd.yaml, gpu/rtx3090_4gpu.yaml]

stage: 1

train:
  epochs: 30
  lr: 2.0e-4
  effective_batch_size: 64
  per_gpu_batch_size: 16
  save_every_steps: 2000
  eval_every_steps: 1000

model:
  ppg:
    hidden: 256
    layers: 2
    heads: 4
    dropout: 0.1
    conv_kernel: 5
  dppg:
    max_clusters: 8
    min_clusters: 2
    samples_per_phone: 2000
    max_frames: 200000

paths:
  checkpoint_dir: checkpoints/stage1
