# Model graph shared by stage 2 and stage 3 (checkpoint compatibility depends on it).
_base_: [frontend.yaml]

model:
  latent_dim: 64
  emotion_encoder:
    hidden: 256
    layers: 4
    heads: 4
    dropout: 0.1
  speaker_encoder:
    hidden: 256
    dropout: 0.1
  speaker_loss:
    margin: 0.2
    scale: 30.0
  decoder:
    hidden: 256
    layers: 4
    heads: 4
    dropout: 0.1
