# Shared defaults for every stage. Stage/GPU configs override these keys.
project:
  name: EmoD
  seed: 1234
  tags: []

paths:
  data_root: data
  manifest_dir: data/manifests
  checkpoint_dir: checkpoints
  log_dir: logs
  phone_label_dir: data/phone_labels

data:
  dataset: esd
  raw_root: data/raw/ESD
  textgrid_root: data/raw/ESD_TextGrid
  sample_rate: 16000
  n_fft: 1024
  win_length: 1024
  hop_length: 320
  n_mels: 80
  f_min: 0.0
  f_max: 8000.0
  emotions: [neutral, angry, happy, sad, surprise]
  phone_set: configs/phones/en_zh_phones.yaml
  min_duration: 0.5
  max_duration: 20.0
  ignore_index: -100

train:
  epochs: 100
  lr: 1.0e-4
  weight_decay: 0.01
  warmup_ratio: 0.05
  grad_clip: 1.0
  log_every: 50
  eval_every_steps: 1000
  save_every_steps: 2000
  keep_last: 3
  resume: auto          # auto | none | <relative path>
  effective_batch_size: 64
  per_gpu_batch_size: 8
  max_steps: null
  find_unused_parameters: false

runtime:
  num_processes: auto   # auto -> min(visible GPUs, 8)
  mixed_precision: fp16 # fp16 | bf16 | no
  tf32: true
  num_workers: 4
  deterministic: false
